name = "vdsi"
version = "0.1.0"
defaultTargets = ["VDSI", "tests", "node", "identity-demo"]

[leanOptions]
warningAsError = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "5ed2965256430c3649e86755f9576b54eca72435"

[[lean_lib]]
name = "VDSI"
# Build the library entry point and all source modules.
globs = ["VDSI", "VDSI.*"]

[[lean_lib]]
name = "Tests"
globs = ["Tests.*"]

[[lean_exe]]
name = "tests"
root = "Tests.Main"

[[lean_exe]]
name = "node"
root = "NodeMain"

[[lean_lib]]
name = "Experiments"
globs = ["Experiments.*"]

[[lean_exe]]
name = "identity-demo"
root = "IdentityMain"

[[lean_exe]]
name = "proof-experiment"
root = "Experiments.ProofTask"
