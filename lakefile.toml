name = "vdsi"
version = "0.1.0"
defaultTargets = ["VDSI", "tests"]

[leanOptions]
warningAsError = true

[[lean_lib]]
name = "VDSI"
# Build the library entry point and all source modules.
globs = ["VDSI", "VDSI.*"]

[[lean_lib]]
name = "Tests"
globs = ["Tests.*"]

[[lean_exe]]
name = "tests"
root = "Tests.Main"

[[lean_lib]]
name = "Experiments"
globs = ["Experiments.*"]

[[lean_exe]]
name = "proof-experiment"
root = "Experiments.ProofTask"
