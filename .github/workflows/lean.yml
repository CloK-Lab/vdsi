name: Lean

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
      - name: Run core tests
        run: lake exe tests
      - name: Test independent node processes
        run: python3 Tests/node_processes.py
      - name: Audit theorem assumptions
        run: lake env lean scripts/Audit.lean
